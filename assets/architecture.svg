<svg width="1400" height="850" viewBox="0 0 1400 850"
  xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#030507"/>
    <stop offset="100%" stop-color="#081016"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>

<!-- BACKGROUND -->

<rect width="1400" height="850" fill="url(#bg)"/>

<!-- TITLE -->

<text x="70" y="75"
   fill="#00E5FF"
   font-family="monospace"
   font-size="30"
   font-weight="bold"
   letter-spacing="5">

NIGHTWATCH // SYSTEM ARCHITECTURE

</text>

<text x="70" y="110"
   fill="#66757D"
   font-family="monospace"
   font-size="15">

INTRUSION DETECTION / NETWORK SECURITY

</text>

<!-- CONNECTION LINES -->

<g stroke="#00E5FF"
stroke-width="2"
fill="none"
opacity="0.65">

<line x1="700" y1="190" x2="700" y2="250"/>

<line x1="700" y1="340" x2="700" y2="400"/>

<line x1="700" y1="490" x2="430" y2="570"/>
<line x1="700" y1="490" x2="970" y2="570"/>

<line x1="430" y1="660" x2="700" y2="730"/>
<line x1="970" y1="660" x2="700" y2="730"/>

</g>

<!-- NETWORK -->

<rect x="520" y="135"
   width="360"
   height="80"
   rx="5"
   fill="#050A0E"
   stroke="#00E5FF"
   stroke-width="2"/>

<text x="700" y="170"
   text-anchor="middle"
   fill="#00E5FF"
   font-family="monospace"
   font-size="18">

NETWORK TRAFFIC

</text>

<text x="700" y="195"
   text-anchor="middle"
   fill="#64747C"
   font-family="monospace"
   font-size="13">

TCP / UDP / ICMP

</text>

<!-- COLLECTOR -->

<rect x="520" y="250"
   width="360"
   height="90"
   rx="5"
   fill="#050A0E"
   stroke="#00E5FF"
   stroke-width="2"/>

<text x="700" y="287"
   text-anchor="middle"
   fill="white"
   font-family="monospace"
   font-size="18">

PACKET COLLECTOR

</text>

<text x="700" y="315"
   text-anchor="middle"
   fill="#00E5FF"
   font-family="monospace"
   font-size="13">

● ACTIVE

</text>

<!-- DETECTION -->

<rect x="520" y="400"
   width="360"
   height="90"
   rx="5"
   fill="#050A0E"
   stroke="#00E5FF"
   stroke-width="2"/>

<text x="700" y="438"
   text-anchor="middle"
   fill="white"
   font-family="monospace"
   font-size="18">

DETECTION ENGINE

</text>

<text x="700" y="465"
   text-anchor="middle"
   fill="#00E5FF"
   font-family="monospace"
   font-size="13">

SIGNATURE ANALYSIS

</text>

<!-- SIGNATURE -->

<rect x="250" y="570"
   width="360"
   height="90"
   rx="5"
   fill="#050A0E"
   stroke="#00E5FF"
   stroke-width="2"/>

<text x="430" y="608"
   text-anchor="middle"
   fill="white"
   font-family="monospace"
   font-size="18">

SIGNATURE ENGINE

</text>

<text x="430" y="635"
   text-anchor="middle"
   fill="#00E5FF"
   font-family="monospace"
   font-size="13">

KNOWN ATTACK PATTERNS

</text>

<!-- EVENT -->

<rect x="790" y="570"
   width="360"
   height="90"
   rx="5"
   fill="#050A0E"
   stroke="#00E5FF"
   stroke-width="2"/>

<text x="970" y="608"
   text-anchor="middle"
   fill="white"
   font-family="monospace"
   font-size="18">

EVENT ANALYZER

</text>

<text x="970" y="635"
   text-anchor="middle"
   fill="#00E5FF"
   font-family="monospace"
   font-size="13">

NORMALIZATION / CORRELATION

</text>

<!-- ALERT -->

<rect x="520" y="730"
   width="360"
   height="80"
   rx="5"
   fill="#10060A"
   stroke="#FF304F"
   stroke-width="2"/>

<text x="700" y="765"
   text-anchor="middle"
   fill="#FF304F"
   font-family="monospace"
   font-size="18">

ALERT / INCIDENT

</text>

<text x="700" y="790"
   text-anchor="middle"
   fill="#FF304F"
   font-family="monospace"
   font-size="13">

THREAT DETECTED

</text>

</svg>
