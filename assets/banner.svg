<svg width="1600" height="500" viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#030507"/>
    <stop offset="55%" stop-color="#071015"/>
    <stop offset="100%" stop-color="#020304"/>
  </linearGradient>

  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00E5FF"/>
    <stop offset="100%" stop-color="#008CFF"/>
  </linearGradient>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40"
          fill="none"
          stroke="#00E5FF"
          stroke-opacity="0.06"
          stroke-width="1"/>
  </pattern>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>

<!-- BACKGROUND -->

<rect width="1600" height="500" fill="url(#bg)"/>

<rect width="1600" height="500" fill="url(#grid)"/>

<!-- TOP / BOTTOM FRAME -->

<line x1="60" y1="45" x2="1540" y2="45"
   stroke="#00E5FF"
   stroke-opacity="0.5"/>

<line x1="60" y1="455" x2="1540" y2="455"
   stroke="#00E5FF"
   stroke-opacity="0.5"/>

<!-- LEFT LABEL -->

<text x="90" y="115"
   fill="#00E5FF"
   font-family="monospace"
   font-size="22"
   letter-spacing="6">

CYBER

</text>

<text x="90" y="150"
   fill="#00E5FF"
   font-family="monospace"
   font-size="22"
   letter-spacing="6">

OPERATIONS

</text>

<!-- MAIN TITLE -->

<text x="800"
   y="225"
   text-anchor="middle"
   fill="white"
   font-family="monospace"
   font-size="64"
   font-weight="bold"
   letter-spacing="14">

IDS

</text>

<text x="800"
   y="275"
   text-anchor="middle"
   fill="#00E5FF"
   font-family="monospace"
   font-size="22"
   letter-spacing="6">

SECURITY RESEARCH / ENGINEERING

</text>

<text x="800"
   y="325"
   text-anchor="middle"
   fill="#9AA6AD"
   font-family="monospace"
   font-size="17"
   letter-spacing="5">

DETECT  •  ANALYZE  •  DEFEND

</text>

<!-- STATUS PANEL -->

<rect x="1190"
   y="90"
   width="300"
   height="150"
   fill="#05090C"
   stroke="#00E5FF"
   stroke-opacity="0.4"/>

<text x="1220"
   y="125"
   fill="#7C8B93"
   font-family="monospace"
   font-size="14"
   letter-spacing="3">

SYSTEM STATUS

</text>

<circle cx="1225"
     cy="155"
     r="6"
     fill="#00E5FF"
     filter="url(#glow)"/>

<text x="1245"
   y="161"
   fill="#00E5FF"
   font-family="monospace"
   font-size="16">

ONLINE

</text>

<text x="1220"
   y="195"
   fill="#7C8B93"
   font-family="monospace"
   font-size="13">

NETWORK      ACTIVE

</text>

<text x="1220"
   y="220"
   fill="#7C8B93"
   font-family="monospace"
   font-size="13">

IDS          ACTIVE

</text>

<!-- NETWORK DATA -->

<g fill="#00E5FF"
opacity="0.15"
font-family="monospace"
font-size="13">

<text x="100" y="390">TCP/443</text> <text x="210" y="390">TCP/22</text> <text x="310" y="390">ICMP</text> <text x="420" y="390">DNS</text> <text x="500" y="390">192.168.10.147</text>

<text x="100" y="420">01010101</text> <text x="230" y="420">11001010</text> <text x="360" y="420">00110101</text> <text x="490" y="420">NETWORK_MONITOR</text>

</g>

<!-- DECORATIVE RED ALERT -->

<line x1="60"
   y1="45"
   x2="230"
   y2="45"
   stroke="#FF304F"
   stroke-width="3"/>

<circle cx="1490"
     cy="45"
     r="4"
     fill="#FF304F"
     filter="url(#glow)"/>

<!-- CORNER MARKERS -->

<path d="M60 70 L60 45 L85 45"
   fill="none"
   stroke="#00E5FF"
   stroke-width="2"/>

<path d="M1540 70 L1540 45 L1515 45"
   fill="none"
   stroke="#00E5FF"
   stroke-width="2"/>

<path d="M60 430 L60 455 L85 455"
   fill="none"
   stroke="#00E5FF"
   stroke-width="2"/>

<path d="M1540 430 L1540 455 L1515 455"
   fill="none"
   stroke="#00E5FF"
   stroke-width="2"/>

</svg>
